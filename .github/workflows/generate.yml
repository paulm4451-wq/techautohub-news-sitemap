name: Generate News Sitemap

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install xml2js node-fetch
      - run: node generate-news-sitemap.js
      - name: Commit and push sitemap
        run: |
          if git status --porcelain | grep 'news-sitemap.xml'; then
            git config user.name "auto-bot"
            git config user.email "auto-bot@users.noreply.github.com"
            git add news-sitemap.xml
            git commit -m "Auto update news sitemap"
            git push
          else
            echo "No changes"
